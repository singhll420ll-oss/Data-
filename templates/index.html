<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bite Me Buddy - Database Viewer</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f8f9fa; padding: 20px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online { background: #28a745; animation: pulse 2s infinite; }
        .offline { background: #dc3545; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        table { font-size: 14px; }
        table th { background: #f8f9fa; position: sticky; top: 0; }
        .refresh-btn { transition: transform 0.3s; }
        .refresh-btn:hover { transform: rotate(180deg); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="row">
                <div class="col-md-8">
                    <h2><i class="fas fa-database"></i> Bite Me Buddy Database</h2>
                    <p class="mb-0">Live PostgreSQL Database Viewer</p>
                </div>
                <div class="col-md-4 text-end">
                    <div class="d-inline-block bg-white text-dark p-2 rounded">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">Checking...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Card -->
        <div class="card">
            <div class="card-body">
                <!-- Controls -->
                <div class="row mb-3">
                    <div class="col-md-8">
                        <div class="alert alert-info mb-0">
                            <i class="fas fa-clock"></i> Last updated: <span id="lastUpdate">Never</span>
                            | Auto-refresh in: <span id="timer">30</span>s
                        </div>
                    </div>
                    <div class="col-md-4 text-end">
                        <button class="btn btn-primary refresh-btn" id="refreshBtn">
                            <i class="fas fa-sync-alt"></i> Refresh Now
                        </button>
                    </div>
                </div>

                <!-- Loading -->
                <div id="loading" class="text-center py-4">
                    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
                    <h4 class="mt-3">Connecting to Database...</h4>
                    <p>Please wait while we fetch your data</p>
                </div>

                <!-- Error -->
                <div id="error" class="alert alert-danger" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="errorMsg"></span>
                </div>

                <!-- Content -->
                <div id="content" style="display: none;">
                    <!-- Tabs -->
                    <ul class="nav nav-tabs mb-3" id="tableTabs">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                <span class="spinner-border spinner-border-sm me-2"></span>
                                Loading Tables...
                            </a>
                        </li>
                    </ul>

                    <!-- Table Content -->
                    <div id="tableContent">
                        <!-- Tables will be loaded here -->
                    </div>
                </div>
            </div>
            <div class="card-footer text-muted text-center">
                <small>
                    <i class="fas fa-database"></i> PostgreSQL | 
                    <i class="fas fa-bolt"></i> Live Updates | 
                    <i class="fas fa-mobile-alt"></i> Mobile Friendly
                </small>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Global variables
        let refreshInterval;
        let countdownInterval;
        
        // Update status
        function updateStatus(connected, message) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (connected) {
                dot.className = 'status-dot online';
                text.textContent = message || 'Connected';
                text.style.color = '#28a745';
            } else {
                dot.className = 'status-dot offline';
                text.textContent = message || 'Disconnected';
                text.style.color = '#dc3545';
            }
        }
        
        // Update last update time
        function updateTime() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = 
                now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'}) + 
                ' ' + now.toLocaleDateString();
        }
        
        // Start countdown
        function startCountdown(seconds = 30) {
            clearInterval(countdownInterval);
            document.getElementById('timer').textContent = seconds;
            
            countdownInterval = setInterval(() => {
                let current = parseInt(document.getElementById('timer').textContent);
                if (current <= 1) {
                    document.getElementById('timer').textContent = 30;
                    loadData();
                } else {
                    document.getElementById('timer').textContent = current - 1;
                }
            }, 1000);
        }
        
        // Load data
        async function loadData() {
            try {
                // Show loading
                document.getElementById('loading').style.display = 'block';
                document.getElementById('content').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                document.getElementById('refreshBtn').disabled = true;
                updateStatus(false, 'Loading...');
                
                const response = await fetch('/api/all');
                const result = await response.json();
                
                if (result.success) {
                    updateStatus(true, `Connected (${Object.keys(result.data).length} tables)`);
                    updateTime();
                    renderTables(result.data);
                    document.getElementById('content').style.display = 'block';
                } else {
                    throw new Error(result.error || 'Failed to load data');
                }
            } catch (error) {
                console.error('Error:', error);
                updateStatus(false, 'Connection failed');
                document.getElementById('errorMsg').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('refreshBtn').disabled = false;
                startCountdown();
            }
        }
        
        // Render tables
        function renderTables(data) {
            const tabs = document.getElementById('tableTabs');
            const content = document.getElementById('tableContent');
            
            tabs.innerHTML = '';
            content.innerHTML = '';
            
            const tables = Object.keys(data);
            
            if (tables.length === 0) {
                content.innerHTML = '<div class="alert alert-warning">No tables found in database</div>';
                return;
            }
            
            // Create tabs
            tables.forEach((table, index) => {
                const tableData = data[table];
                
                // Tab button
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.innerHTML = `
                    <button class="nav-link ${index === 0 ? 'active' : ''}" 
                            onclick="showTable('${table}')"
                            id="tab-${table}">
                        ${table}
                        <span class="badge bg-secondary">${tableData.count || 0}</span>
                    </button>
                `;
                tabs.appendChild(li);
                
                // Table content
                const div = document.createElement('div');
                div.id = `content-${table}`;
                div.className = `table-content ${index === 0 ? '' : 'd-none'}`;
                
                if (tableData.error) {
                    div.innerHTML = `<div class="alert alert-danger">Error: ${tableData.error}</div>`;
                } else if (tableData.data.length === 0) {
                    div.innerHTML = '<div class="alert alert-info">No data in this table</div>';
                } else {
                    let html = `
                        <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                            <table class="table table-hover table-sm">
                                <thead>
                                    <tr>
                    `;
                    
                    // Headers
                    tableData.columns.forEach(col => {
                        html += `<th>${col.replace(/_/g, ' ').toUpperCase()}</th>`;
                    });
                    
                    html += `</tr></thead><tbody>`;
                    
                    // Data rows
                    tableData.data.forEach(row => {
                        html += '<tr>';
                        tableData.columns.forEach(col => {
                            const value = row[col];
                            let display = value;
                            
                            if (value === null || value === undefined) {
                                display = '<span class="text-muted">NULL</span>';
                            } else if (typeof value === 'boolean') {
                                display = value ? 
                                    '<i class="fas fa-check text-success"></i>' : 
                                    '<i class="fas fa-times text-danger"></i>';
                            }
                            
                            html += `<td>${display}</td>`;
                        });
                        html += '</tr>';
                    });
                    
                    html += `</tbody></table></div>
                        <div class="mt-2">
                            <span class="badge bg-primary">${tableData.data.length} rows</span>
                            <span class="badge bg-info ms-2">${tableData.columns.length} columns</span>
                        </div>
                    `;
                    
                    div.innerHTML = html;
                }
                
                content.appendChild(div);
            });
        }
        
        // Show specific table
        function showTable(tableName) {
            // Update active tab
            document.querySelectorAll('.nav-link').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(`tab-${tableName}`).classList.add('active');
            
            // Show selected content
            document.querySelectorAll('.table-content').forEach(content => {
                content.classList.add('d-none');
            });
            document.getElementById(`content-${tableName}`).classList.remove('d-none');
        }
        
        // Event listeners
        document.getElementById('refreshBtn').addEventListener('click', loadData);
        
        // Initial load
        loadData();
        
        // Auto-refresh every 30 seconds
        refreshInterval = setInterval(loadData, 30000);
        
        // Cleanup
        window.addEventListener('beforeunload', () => {
            clearInterval(refreshInterval);
            clearInterval(countdownInterval);
        });
    </script>
</body>
</html>
