<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bite Me Buddy Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background: #f0f2f5; }
        .card { margin-top: 20px; }
        .status { padding: 5px 10px; border-radius: 5px; }
        .online { background: #d4edda; color: #155724; }
        .offline { background: #f8d7da; color: #721c24; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .online-dot { background: #28a745; animation: pulse 2s infinite; }
        .offline-dot { background: #dc3545; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3>Bite Me Buddy Database Viewer</h3>
            </div>
            <div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                    <div>
                        <span class="status-dot" id="statusDot"></span>
                        Status: <span id="statusText">Loading...</span>
                    </div>
                    <button class="btn btn-primary" id="refreshBtn">Refresh</button>
                </div>
                
                <div class="mb-2">
                    <small>Last update: <span id="lastUpdate">Never</span></small>
                </div>
                
                <div id="loading" class="text-center">
                    <div class="spinner-border"></div>
                    <p>Loading database...</p>
                </div>
                
                <div id="error" class="alert alert-danger" style="display:none;"></div>
                
                <div id="content" style="display:none;">
                    <ul class="nav nav-tabs" id="tabs"></ul>
                    <div class="tab-content p-3 border border-top-0" id="tabContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('refreshBtn').disabled = true;
            
            try {
                const response = await fetch('/api/all');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('statusDot').className = 'status-dot online-dot';
                    document.getElementById('statusText').textContent = 'Connected';
                    document.getElementById('statusText').style.color = '#28a745';
                    document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
                    showTables(data.data);
                } else {
                    throw new Error(data.error);
                }
            } catch (e) {
                document.getElementById('statusDot').className = 'status-dot offline-dot';
                document.getElementById('statusText').textContent = 'Disconnected';
                document.getElementById('statusText').style.color = '#dc3545';
                document.getElementById('error').textContent = e.message;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('refreshBtn').disabled = false;
            }
        }
        
        function showTables(data) {
            const tabs = document.getElementById('tabs');
            const content = document.getElementById('tabContent');
            tabs.innerHTML = '';
            content.innerHTML = '';
            
            Object.keys(data).forEach((table, index) => {
                const tableData = data[table];
                
                // Create tab
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.innerHTML = `<button class="nav-link ${index===0?'active':''}" onclick="showTab('${table}')">${table} (${tableData.count||0})</button>`;
                tabs.appendChild(li);
                
                // Create content
                const div = document.createElement('div');
                div.className = `tab-pane ${index===0?'active':''}`;
                div.id = `tab-${table}`;
                
                if (tableData.data && tableData.data.length > 0) {
                    let html = '<table class="table table-sm"><thead><tr>';
                    tableData.columns.forEach(col => {
                        html += `<th>${col}</th>`;
                    });
                    html += '</tr></thead><tbody>';
                    
                    tableData.data.forEach(row => {
                        html += '<tr>';
                        tableData.columns.forEach(col => {
                            let value = row[col];
                            if (value === null || value === undefined) {
                                value = '<span class="text-muted">NULL</span>';
                            } else if (typeof value === 'boolean') {
                                value = value ? '✅' : '❌';
                            }
                            html += `<td>${value}</td>`;
                        });
                        html += '</tr>';
                    });
                    
                    html += '</tbody></table>';
                    div.innerHTML = html;
                } else {
                    div.innerHTML = '<p class="text-muted">No data available</p>';
                }
                
                content.appendChild(div);
            });
            
            document.getElementById('content').style.display = 'block';
        }
        
        function showTab(table) {
            // Update active tab
            document.querySelectorAll('.nav-link').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Show selected tab content
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.remove('active');
            });
            document.getElementById(`tab-${table}`).classList.add('active');
        }
        
        // Event listeners
        document.getElementById('refreshBtn').addEventListener('click', loadData);
        
        // Initial load
        loadData();
        
        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
